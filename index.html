<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }
      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
      /* when the page is wider than the 1200px canvas, let its sides melt into the page */
      @media (min-width: 1201px) {
        canvas {
          -webkit-mask-image: linear-gradient(
            to right,
            transparent,
            #000 70px,
            #000 calc(100% - 70px),
            transparent
          );
          mask-image: linear-gradient(to right, transparent, #000 70px, #000 calc(100% - 70px), transparent);
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
